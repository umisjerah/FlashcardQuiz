<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3546A5">
  <meta name="description" content="Create flashcard decks, study smarter, quiz yourself, and track your learning progress.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Flashcards">
  <title>Flashcard Quiz</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#dashboard" data-nav="dashboard" aria-label="Flashcard Quiz dashboard">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="5" y="7" width="17" height="21" rx="3"/><path d="M10 4h14a3 3 0 0 1 3 3v16"/><path d="M10 13h8M10 18h8"/></svg></span>
        <span class="brand-copy"><strong>Flashcard Quiz</strong><small>Study space</small></span>
      </a>
      <div class="sidebar-label">WORKSPACE</div>
      <nav class="side-nav">
        <button class="nav-link active" data-nav="dashboard"><span class="nav-icon">▦</span><span>Dashboard</span></button>
        <button class="nav-link" data-nav="decks"><span class="nav-icon">▤</span><span>My Decks</span></button>
        <button class="nav-link" data-nav="study"><span class="nav-icon">▱</span><span>Study</span></button>
        <button class="nav-link" data-nav="quiz"><span class="nav-icon">✓</span><span>Quiz</span></button>
        <button class="nav-link" data-nav="progress"><span class="nav-icon">◔</span><span>My Progress</span></button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-tip">
        <span class="tip-icon">✦</span>
        <strong>Little by little</strong>
        <p>Every card you review is a step toward knowing more.</p>
      </div>
      <button class="nav-link settings-link" data-nav="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
      <div class="sidebar-foot"><span class="online-dot"></span> Your study space is saved on this device</div>
    </aside>

    <div class="mobile-overlay" id="mobileOverlay"></div>
    <main class="main-area">
      <header class="topbar">
        <button class="icon-button menu-toggle" id="menuToggle" aria-label="Open navigation" aria-expanded="false">☰</button>
        <div class="breadcrumb"><span>Workspace</span><span class="crumb-slash">/</span><strong id="pageCrumb">Dashboard</strong></div>
        <div class="topbar-actions">
          <span class="saved-indicator"><span class="online-dot"></span><span>Saved locally</span></span>
          <button class="avatar" id="profileShortcut" title="Open settings" aria-label="Open profile settings">S</button>
        </div>
      </header>
      <section class="page-container" id="appView" aria-live="polite">
        <div class="loading-state">Loading your study space…</div>
      </section>
      <footer class="app-footer"><span>Flashcard Quiz</span><span>Made for focused learning</span></footer>
    </main>
  </div>

  <div class="modal-root" id="modalRoot" aria-live="polite"></div>
  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  <noscript><div class="noscript-message">Flashcard Quiz needs JavaScript enabled to run.</div></noscript>
</body>
</html>
